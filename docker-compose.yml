services:
  # Spring Boot Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: feel-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-password}
    depends_on:
      - db
    networks:
      - feel-network
    restart: unless-stopped

  # MySQL Database (배포용)
  db:
    image: mysql:8.0
    container_name: feel-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: feeldb
      MYSQL_USER: ${DB_USERNAME:-feel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - feel-network
    restart: unless-stopped

  # PostgreSQL (대안 - 필요 시 사용)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: feel-postgres
  #   environment:
  #     POSTGRES_DB: feeldb
  #     POSTGRES_USER: ${DB_USERNAME:-feel}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - feel-network
  #   restart: unless-stopped

networks:
  feel-network:
    driver: bridge

volumes:
  mysql-data:
  # postgres-data:
