services:
  # 1. Database: MySQL
  db:
    image: mysql:8.0
    container_name: feel-db
    restart: always
    environment:
      MYSQL_DATABASE: feeldb
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_here}
      MYSQL_USER: ${DB_USERNAME:-feel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-5049}
      TZ: Asia/Seoul
    volumes:
      - ./mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password_here}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 2. Backend: Feel_Backend
  backend:
    build: ./Feel_Backend
    container_name: feel-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_USERNAME=${DB_USERNAME:-feel}
      - DB_PASSWORD=${DB_PASSWORD:-5049}
    volumes:
      - ./uploads:/app/uploads
    expose:
      - "8080"
    networks:
      - feel-network

networks:
  feel-network:
    driver: bridge
