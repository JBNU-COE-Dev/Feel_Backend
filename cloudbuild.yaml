# Google Cloud Build 설정 파일
# Docker 이미지 빌드 및 Cloud Run 배포 자동화

steps:
  # Step 1: Maven 빌드
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'package', '-DskipTests']

  # Step 2: Docker 이미지 빌드
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/feel-backend:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/feel-backend:latest',
      '.'
    ]

  # Step 3: Docker 이미지 푸시
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/feel-backend:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/feel-backend:latest']

  # Step 4: Cloud Run 배포
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'feel-backend'
      - '--image=gcr.io/$PROJECT_ID/feel-backend:$COMMIT_SHA'
      - '--region=asia-northeast3'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=SPRING_PROFILES_ACTIVE=prod'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'

# 빌드 결과 이미지
images:
  - 'gcr.io/$PROJECT_ID/feel-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/feel-backend:latest'

# 빌드 옵션
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# 타임아웃 설정 (기본 10분)
timeout: '1200s'
