# Production Configuration

# MySQL Configuration (배포 시)
spring.datasource.url=jdbc:mysql://db:3306/feeldb?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# PostgreSQL Configuration (배포 시 대안)
# spring.datasource.url=jdbc:postgresql://postgres:5432/feeldb
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}

# JPA Configuration for Production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable H2 Console in Production
spring.h2.console.enabled=false

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# Base URL for file URLs (환경변수로 주입, 기본값: 로컬)
app.base-url=${APP_BASE_URL:http://api.feel-test.com}

# Logging for Production
logging.level.root=INFO
logging.level.com.feel.backend=INFO
